# 配置名称: Quantumult X 自用配置
# 配置作者: RayPan809
# 更新时间: 2026-07-23
# “;” “#”为注释符号，去掉此类符号，该行才会生效。
# 图标库 → Qure：https://github.com/Koolson/Qure/tree/master/IconSet 或 OrzMini：https://github.com/Orz-3/mini
# 引用部分DivineEngine和blackmatrix7规则, KOP-XIAO资源解析器，geo-checker js脚本, ip-api数据库

# 建议在「其他设置」里「GeoLite2」的「来源」填写使用下面链接「任选一个」，并开启「自动更新」
;https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
;https://github.com/Hackl0us/GeoIP2-CN/raw/release/Country.mmdb

[general]
# 配置文件图标
;profile_img_url = http://www.example.com/example.png

# 资源解析器，可用于自定义各类远程资源的转换，如节点，规则 filter，复写 rewrite 等，url 地址可远程，可 本地/iCloud(Quantumult X/Scripts目录);
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js

# Quantumult X 会对 server_check_url 指定的网址进行相应测试，以确认节点的可用性
# 你同样可以在 server_local/remote 中，为节点、订阅单独指定 server_check_url 参数
# 如你为节点单独指定了 url，则所有相关延迟测试中，均会采用此 url 地址
server_check_url = http://www.gstatic.com/generate_204
# 节点延迟测试超时参数，需小于 5000 毫秒才生效
server_check_timeout = 3000

# geo_location_checker 用于节点页面的节点信息展示，可完整自定义展示内容与方式
# extreme-ip-lookup 为 Quantumult X 作者提供的示范 api
;geo_location_checker = http://extreme-ip-lookup.com/json/, https://raw.githubusercontent.com/crossutility/Quantumult-X/master/sample-location-with-script.js
# 下面是我所使用的 api 及获取、展示节点信息的 js
geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js

# 运行模式模块，running_mode_trigger 设置，即根据网络自动切换 分流/直连/全局代理 等模式。
# running-mode-trigger 模式下，跟手动切换直连/全局代理 等效，rewrite/task 模块始终会生效，比 ssid 策略组设置简单，比 ssid-suspend 更灵活。

;running_mode_trigger = filter, filter, wifi-5g:all_direct, wifi:all_proxy
# 上述写法，前两个 filter 先后表示 在 [数据蜂窝网络] 跟 [一般 Wi-Fi] 下，走 filter(分流)模式，后面则表示在 wifi-5g 下切换为全局直连[all_direct]，wifi 切换为全局代理[all_proxy]
# 如需使用，相应 SSID 换成你自己 Wi-Fi 名即可

# DNS 排除列表
# dns_exclusion_list 中的域名将不使用 fake-ip 方式，其它域名则全部采用 fake-ip 及远程解析的模式
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com

# UDP 白名单，留空则默认所有为端口。不在 udp 白名单列表中的端口，将被丢弃处理（返回 ICMP “端口不可达” 信息）。
;udp_whitelist = 1-442, 444-65535

# UDP Drop 名单，同白名单类似，但不会返回 ICMP “端口不可达” 信息
# drop 名单仅处理 whitelist 名单中的端口
udp_drop_list = 443, STUN, QUIC

# 下列表中的内容将不经过 Quantumult X 的处理，设置后建议重启设备
excluded_routes = 239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32

[dns]
# 禁用系统 DNS
no-system

# 禁用 IPv6
# Quantumult X 开启 IPv6 方法，删去下面的「no-ipv6」，在「VPN」栏中，开启「兼容性增强」
no-ipv6

# 自定义 DNS
# > 阿⾥AliDNS
server=223.5.5.5
server=223.6.6.6
